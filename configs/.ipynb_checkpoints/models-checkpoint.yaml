# ============================================================================
# Model + SAE Configurations
# ============================================================================
# Each top-level key is a config name usable with --config <name>
#
# sae_type: "none" | "goodfire" | "gemma_scope"
#   - "none"        → bare HF model (baseline)
#   - "goodfire"    → Goodfire SAE (LLaMA, Mistral)
#   - "gemma_scope" → Gemma Scope via sae_lens (Gemma-2 family)
# ============================================================================

# ── Gemma-2-2B ──────────────────────────────────────────────────────────────

gemma_2b_base:
  model_name: google/gemma-2-2b
  sae_type: none
  dtype: float32

gemma_2b_sae:
  model_name: google/gemma-2-2b
  sae_type: gemma_scope
  sae_release: gemma-scope-2b-pt-res-canonical
  sae_id: layer_12/width_16k/canonical
  dtype: float32

